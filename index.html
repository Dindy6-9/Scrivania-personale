<!DOCTYPE html>
<!-- Scrivania Mia — v2.0 — categorie, tag, editing inline, stampa/download -->
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scrivania Mia</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --paper: #E3EAC4;
    --surface: #D6E1AC;
    --ink: #171A0F;
    --ink-soft: #5C6740;
    --forest: #93A83E;
    --forest-dark: #6E8A2C;
    --brick: #A83B23;
    --border: #C3D08C;
    --rosso-settimana: #B0524A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  #login, #chi-sei {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 48px 40px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  #login h1, #chi-sei h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--forest-dark);
    margin-bottom: 6px;
  }
  #login p.tag, #chi-sei p.tag {
    color: var(--ink-soft);
    font-size: 0.9rem;
    margin-bottom: 32px;
  }
  #pin-input {
    width: 100%;
    padding: 12px 14px;
    font-size: 1.1rem;
    letter-spacing: 4px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--paper);
    color: var(--ink);
    margin-bottom: 12px;
  }
  #pin-input:focus { outline: 2px solid var(--forest); outline-offset: 1px; }
  #pin-errore {
    display: none;
    color: var(--brick);
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 12px;
  }
  .btn-primary {
    width: 100%;
    padding: 12px;
    background: var(--forest);
    color: #fff;
    border: none;
    border-radius: 3px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    margin-bottom: 10px;
  }
  .btn-primary:hover { background: var(--forest-dark); }
  .btn-primary:disabled { opacity: 0.6; cursor: wait; }

  #app {
    display: none;
    width: 100%;
    max-width: 900px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  header.appbar {
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  header.appbar h1 {
    font-family: 'Fraunces', serif;
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--forest-dark);
  }
  header.appbar span { font-size: 0.8rem; color: var(--ink-soft); }

  .search-row { padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--paper); }
  .search-input-wrap { position: relative; }
  .search-row input {
    width: 100%;
    padding: 9px 34px 9px 14px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--surface);
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
  }
  .search-row input:focus { outline: 2px solid var(--forest); outline-offset: 1px; }
  .btn-clear-ricerca {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    font-size: 0.95rem;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px 6px;
    line-height: 1;
  }
  .btn-clear-ricerca:hover { color: var(--brick); }
  .search-hint { font-size: 0.72rem; color: var(--ink-soft); margin-top: 6px; }
  .azioni-export { display: flex; gap: 8px; margin-top: 8px; }
  .btn-export {
    padding: 6px 12px;
    border: 1.5px solid var(--forest-dark);
    border-radius: 3px;
    background: var(--surface);
    color: var(--forest-dark);
    font-size: 0.78rem;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-export:hover { background: var(--forest); color: #fff; }

  .link-row {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
  }
  .link-row:last-child { border-bottom: none; }
  .link-row .titolo { font-weight: 500; font-size: 0.8rem; flex: 1; }
  .link-row a {
    font-size: 0.72rem;
    color: var(--forest);
    text-decoration: none;
    border-bottom: 1px solid var(--forest);
  }
  #link-lista:empty::after {
    content: "Nessun link salvato";
    font-size: 0.82rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .appunto {
    background: var(--surface);
    border-left: 3px solid var(--forest);
    border-radius: 3px;
    padding: 8px 12px;
    margin-bottom: 5px;
  }
  .appunto-data { font-family: 'Fraunces', serif; font-size: 0.72rem; font-weight: 600; color: var(--forest-dark); margin-bottom: 3px; }
  .appunto p { font-size: 0.86rem; font-weight: 500; line-height: 1.45; color: var(--ink); white-space: pre-wrap; }
  .appunto-textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--paper);
    font-family: inherit;
    font-size: 0.88rem;
    color: var(--ink);
    resize: vertical;
  }
  .appunto-textarea:focus { outline: 2px solid var(--forest); outline-offset: 1px; }
  #appunti-lista:empty::after {
    content: "Nessun appunto ancora";
    font-size: 0.82rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .scadenza {
    display: flex;
    gap: 12px;
    padding: 4px 0;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .scadenza:last-child { border-bottom: none; }
  .scadenza .data {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.74rem;
    color: var(--forest-dark);
    width: 66px;
    flex-shrink: 0;
    white-space: nowrap;
    text-align: center;
    border: 1.5px solid var(--forest-dark);
    border-radius: 2px;
    padding: 3px 0;
  }
  .scadenza .data small { display: inline; font-size: 0.74rem; color: var(--ink-soft); font-weight: 700; margin-left: 4px; text-transform: lowercase; }
  .scadenza .contenuto { flex: 1; }
  .scadenza .contenuto .titolo { font-weight: 500; font-size: 0.85rem; margin-bottom: 1px; }
  .scadenza .contenuto .meta { font-size: 0.78rem; color: var(--ink-soft); }
  .scadenza.urgente .data { color: var(--brick); border-color: var(--brick); }
  .scadenza.settimana-corrente .data { color: var(--rosso-settimana); border-color: var(--rosso-settimana); }
  .badge-urgente { font-size: 0.66rem; color: var(--ink-soft); font-weight: 500; margin-left: 4px; }
  .badge-categoria {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    color: var(--forest-dark);
    background: var(--paper);
    border: 1px solid var(--forest);
    padding: 0px 7px;
    border-radius: 3px;
    flex-shrink: 0;
    white-space: nowrap;
  }
  #scadenze-attive:empty::after, #scadenze-completate:empty::after {
    content: "Nessuna scadenza qui";
    font-size: 0.82rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .filtri-categoria { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .filtro-chip {
    padding: 4px 12px;
    border: 1.5px solid var(--forest-dark);
    border-radius: 3px;
    background: var(--surface);
    color: var(--forest-dark);
    font-size: 0.78rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .filtro-chip.attivo { background: var(--forest); color: #fff; }
  .categoria-select {
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--paper);
    font-family: inherit;
    font-size: 0.82rem;
    color: var(--ink);
    flex: 0 0 auto;
  }

  .tag-nota-inline {
    display: inline-block;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--forest-dark);
    background: var(--paper);
    border: 1px solid var(--forest);
    border-radius: 3px;
    padding: 0px 6px;
    margin-right: 4px;
  }

  [contenteditable="true"] { border-radius: 2px; padding: 0 2px; margin: 0 -2px; }
  [contenteditable="true"]:hover { background: var(--paper); cursor: text; }
  [contenteditable="true"]:focus { outline: 1.5px dashed var(--forest); background: var(--paper); }

  .diario-entry .checkbox { flex-shrink: 0; }

  nav.tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--paper); }
  nav.tabs button {
    flex: 1;
    min-width: 80px;
    padding: 12px 6px;
    background: none;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--forest-dark);
    cursor: pointer;
    border-bottom: 2px solid transparent;
  }
  nav.tabs button.active { border-bottom: 2px solid var(--forest); background: var(--surface); }

  section.panel { display: none; padding: 24px 28px; min-height: 380px; }
  section.panel.active { display: block; }

  .diario-day { margin-bottom: 7px; }
  .diario-day .giorno { font-family: 'Fraunces', serif; font-weight: 600; font-size: 0.88rem; color: var(--forest-dark); margin-bottom: 3px; }
  .diario-entry {
    display: flex;
    gap: 8px;
    padding: 5px 9px;
    background: var(--surface);
    border-radius: 3px;
    margin-bottom: 1px;
    font-size: 0.86rem;
    font-weight: 500;
    align-items: flex-start;
  }
  .diario-entry .checkbox {
    width: 20px;
    height: 20px;
    border: 2.5px solid var(--forest-dark);
    border-radius: 3px;
    cursor: pointer;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 0.7rem;
    font-weight: 700;
    background: var(--paper);
  }
  .diario-entry .checkbox.checked { background: var(--forest); border-color: var(--forest); }
  .diario-entry.gestita { opacity: 0.45; }
  .diario-entry .elimina {
    margin-left: auto;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 0.9rem;
    color: var(--ink-soft);
    flex-shrink: 0;
    padding: 0 4px;
  }
  .diario-entry .elimina:hover { color: var(--brick); }
  #todo-lista:empty::after, #note-lista:empty::after {
    content: "Niente qui per ora";
    font-size: 0.82rem;
    color: var(--ink-soft);
    font-style: italic;
  }
  #diario-lista:empty::after {
    content: "Nessuna annotazione ancora";
    font-size: 0.82rem;
    color: var(--ink-soft);
    font-style: italic;
  }

  .add-row { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .add-row input {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--paper);
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink);
  }
  .diario-data-input { flex: 0 0 140px !important; }
  .nota-tag-field { flex: 0 0 220px !important; }
  @media (max-width: 600px) { .nota-tag-field, .scadenza-add-row input[type="text"] { flex-basis: 100% !important; } }
  .allarme-toggle {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--forest-dark);
    white-space: nowrap;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .allarme-toggle input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--forest); }
  .anticipo-wrap { display: flex; align-items: center; gap: 7px; font-size: 0.82rem; font-weight: 500; color: var(--ink-soft); white-space: nowrap; }
  .anticipo-btn {
    width: 26px; height: 26px;
    border: 2px solid var(--forest-dark);
    border-radius: 3px;
    background: var(--surface);
    color: var(--forest-dark);
    font-size: 1rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .anticipo-btn:hover { background: var(--forest); color: #fff; }
  .anticipo-valore { min-width: 22px; text-align: center; font-size: 0.95rem; font-weight: 700; color: var(--ink); }
  .add-row button {
    padding: 9px 16px;
    background: var(--forest);
    color: #fff;
    border: none;
    border-radius: 3px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    flex: 0 0 auto;
  }
  .add-row button:disabled { opacity: 0.6; cursor: wait; }

  h2.panel-title { font-family: 'Fraunces', serif; font-size: 1.1rem; font-weight: 600; margin-bottom: 16px; color: var(--ink); }
  footer.note { padding: 10px 28px; font-size: 0.72rem; color: var(--ink-soft); border-top: 1px solid var(--border); background: var(--paper); }

  @media print {
    body { background: #fff; padding: 0; display: block; }
    #login, #chi-sei { display: none !important; }
    #app { max-width: 100%; border: none; }
    header.appbar, .search-row, nav.tabs, footer.note, .add-row { display: none !important; }
    section.panel { padding: 0; }
    .checkbox { border-color: #000 !important; }
    [contenteditable="true"]:hover, [contenteditable="true"]:focus { background: none !important; outline: none !important; }
  }
</style>
</head>
<body>

  <div id="login">
    <h1>Scrivania Mia</h1>
    <p class="tag">Inserisci il PIN per accedere</p>
    <input type="password" id="pin-input" maxlength="4" placeholder="• • • •" inputmode="numeric">
    <div id="pin-errore">PIN errato, riprova.</div>
    <button class="btn-primary" id="btn-login" onclick="tentaLogin()">Entra</button>
  </div>

  <div id="app">
    <header class="appbar">
      <h1>Scrivania Mia</h1>
      <span id="stato-connessione">Connessione…</span>
    </header>

    <div class="search-row">
      <div class="search-input-wrap">
        <input type="text" id="ricerca" placeholder="Cerca in to do, scadenze, diario, note, appunti, link…" oninput="cerca(this.value)">
        <button class="btn-clear-ricerca" onclick="pulisciRicerca()" title="Cancella ricerca">✕</button>
      </div>
      <div class="search-hint" id="search-hint" style="display:none;"></div>
      <div class="azioni-export">
        <button class="btn-export" onclick="stampaVista()">🖨 Stampa</button>
        <button class="btn-export" onclick="scaricaVista()">⬇ Scarica</button>
      </div>
    </div>

    <nav class="tabs">
      <button class="active" onclick="mostra('todo', this)">To Do</button>
      <button onclick="mostra('scadenze', this)">Scadenze</button>
      <button onclick="mostra('diario', this)">Diario</button>
      <button onclick="mostra('note', this)">Note</button>
      <button onclick="mostra('appunti', this)">Appunti</button>
      <button onclick="mostra('link', this)">Link</button>
      <button onclick="mostra('completate', this)">Completate</button>
    </nav>

    <section class="panel active" id="todo">
      <h2 class="panel-title">To Do</h2>
      <div id="todo-lista"></div>
      <div class="add-row">
        <input type="text" id="todo-input" placeholder="Nuovo task…" onkeydown="if(event.key==='Enter') aggiungiTodo()">
        <button onclick="aggiungiTodo()">Aggiungi</button>
      </div>
    </section>

    <section class="panel" id="scadenze">
      <h2 class="panel-title">Prossime scadenze</h2>
      <div class="filtri-categoria" id="filtri-scadenze"></div>
      <div id="scadenze-attive"></div>

      <div class="add-row scadenza-add-row">
        <input type="date" id="scadenza-data-input" class="diario-data-input">
        <input type="text" id="scadenza-input" placeholder="Nuova scadenza…" style="flex:1;">
        <select id="scadenza-categoria" class="categoria-select" onchange="gestisciNuovaCategoria(this, 'scadenze')">
          <option value="Bandi">Bandi</option>
          <option value="Contabili">Contabili</option>
          <option value="Admin">Admin</option>
          <option value="Altro">Altro</option>
          <option value="__nuova__">+ Nuova categoria…</option>
        </select>
        <label class="allarme-toggle"><input type="checkbox" id="scadenza-allarme" onchange="toggleAnticipo(this)"> 🔔 Allarme</label>
        <span class="anticipo-wrap" id="anticipo-wrap" style="display:none;">
          avvisami
          <button type="button" class="anticipo-btn" onclick="cambiaAnticipo(-1)">−</button>
          <span class="anticipo-valore" id="anticipo-valore">1</span>
          <button type="button" class="anticipo-btn" onclick="cambiaAnticipo(1)">+</button>
          <span id="anticipo-label">giorni prima</span>
        </span>
        <button onclick="aggiungiScadenza()">Aggiungi</button>
      </div>
    </section>

    <section class="panel" id="diario">
      <h2 class="panel-title">Diario giornaliero</h2>
      <div id="diario-lista"></div>
      <div class="add-row diario-add-row">
        <input type="date" id="diario-data-input" class="diario-data-input">
        <input type="text" id="diario-input" placeholder="Cosa hai fatto?" style="flex:1;" onkeydown="if(event.key==='Enter') aggiungiDiario()">
        <button onclick="aggiungiDiario()">Aggiungi</button>
      </div>
    </section>

    <section class="panel" id="note">
      <h2 class="panel-title">Note</h2>
      <div id="note-lista"></div>
      <div class="add-row nota-add-row">
        <input type="text" id="nota-tag-input" placeholder="Etichetta (es. Bando Cultura, Telefonare…)" class="nota-tag-field">
        <input type="text" id="nota-input" placeholder="Testo della nota…" style="flex:1;" onkeydown="if(event.key==='Enter') aggiungiNota()">
        <button onclick="aggiungiNota()">Aggiungi</button>
      </div>
    </section>

    <section class="panel" id="appunti">
      <h2 class="panel-title">Appunti</h2>
      <div id="appunti-lista"></div>
      <textarea class="appunto-textarea" id="appunto-input" placeholder="Scrivi un nuovo appunto…" rows="3"></textarea>
      <div class="add-row" style="margin-top:8px;">
        <button style="flex:0 0 auto; padding:9px 20px;" onclick="aggiungiAppunto()">Salva appunto</button>
      </div>
    </section>

    <section class="panel" id="link">
      <h2 class="panel-title">Link e riferimenti</h2>
      <div class="filtri-categoria" id="filtri-link"></div>
      <div id="link-lista"></div>
      <div class="add-row">
        <input type="text" id="link-titolo-input" placeholder="Titolo…" style="flex:1;">
        <input type="text" id="link-url-input" placeholder="Link…" style="flex:1;">
        <select id="link-categoria" class="categoria-select" onchange="gestisciNuovaCategoria(this, 'link')">
          <option value="Generali">Generali</option>
          <option value="Fornitori">Fornitori</option>
          <option value="Altro">Altro</option>
          <option value="__nuova__">+ Nuova categoria…</option>
        </select>
        <button onclick="aggiungiLink()">Aggiungi</button>
      </div>
    </section>

    <section class="panel" id="completate">
      <h2 class="panel-title">Scadenze completate</h2>
      <div id="scadenze-completate"></div>
    </section>

    <footer class="note">Scrivania Mia · v2.0 · dati salvati su Firebase in tempo reale</footer>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, updateDoc, deleteDoc, doc,
  onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRLvtTOxT_10iO-FDdjcSe59psgt9efUU",
  authDomain: "scrivania-personale.firebaseapp.com",
  projectId: "scrivania-personale",
  storageBucket: "scrivania-personale.firebasestorage.app",
  messagingSenderId: "797380737722",
  appId: "1:797380737722:web:b5ab6dc77d4036ca1fa083"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

async function sha256(testo) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(testo));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
const PIN_HASH_REALE = await sha256("1661");

window.tentaLogin = async function() {
  const btn = document.getElementById('btn-login');
  const val = document.getElementById('pin-input').value;
  const errore = document.getElementById('pin-errore');
  btn.disabled = true;
  const hashInserito = await sha256(val);
  if (hashInserito === PIN_HASH_REALE) {
    try {
      await signInAnonymously(auth);
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      avviaAscoltoDati();
    } catch (e) {
      errore.textContent = "Errore di connessione, riprova.";
      errore.style.display = 'block';
      btn.disabled = false;
    }
  } else {
    errore.textContent = "PIN errato, riprova.";
    errore.style.display = 'block';
    document.getElementById('pin-input').value = '';
    btn.disabled = false;
  }
};

// ============================================================
// UTILITÀ
// ============================================================
const MESI = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const MESI_LUNGHI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const GIORNI_SETT = ['do','lu','ma','me','gi','ve','sa'];

function oggiISO() { return new Date().toISOString().split('T')[0]; }

function formatDataBreve(dataISO) {
  const d = new Date(dataISO + 'T00:00:00');
  return { giorno: String(d.getDate()).padStart(2, '0'), mese: MESI[d.getMonth()].toUpperCase(), sett: GIORNI_SETT[d.getDay()] };
}

function formatGiornoLungo(dataISO) {
  const d = new Date(dataISO + 'T00:00:00');
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const ieri = new Date(oggi); ieri.setDate(ieri.getDate() - 1);
  const dCheck = new Date(d); dCheck.setHours(0,0,0,0);
  if (dCheck.getTime() === oggi.getTime()) return 'Oggi — ' + d.getDate() + ' ' + MESI_LUNGHI[d.getMonth()];
  if (dCheck.getTime() === ieri.getTime()) return 'Ieri — ' + d.getDate() + ' ' + MESI_LUNGHI[d.getMonth()];
  return d.getDate() + ' ' + MESI_LUNGHI[d.getMonth()];
}

function contoAllaRovescia(dataISO) {
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const scadenza = new Date(dataISO + 'T00:00:00');
  const diffGiorni = Math.round((scadenza - oggi) / 86400000);
  let testo, urgente = false;
  if (diffGiorni < 0) { testo = 'scaduta'; urgente = true; }
  else if (diffGiorni === 0) { testo = 'oggi'; urgente = true; }
  else if (diffGiorni === 1) { testo = 'domani'; urgente = true; }
  else if (diffGiorni <= 6) { testo = 'tra ' + diffGiorni + ' giorni'; urgente = true; }
  else if (diffGiorni <= 60) { testo = 'tra ' + Math.round(diffGiorni / 7) + ' settimane'; }
  else { testo = 'tra ' + Math.round(diffGiorni / 30) + ' mesi'; }
  return { testo, urgente };
}

function inSettimanaCorrente(dataISO) {
  const oggi = new Date(); oggi.setHours(0,0,0,0);
  const scadenza = new Date(dataISO + 'T00:00:00');
  const giornoSett = oggi.getDay();
  const offsetLunedi = giornoSett === 0 ? 6 : giornoSett - 1;
  const lunedi = new Date(oggi); lunedi.setDate(oggi.getDate() - offsetLunedi);
  const domenica = new Date(lunedi); domenica.setDate(lunedi.getDate() + 6);
  return scadenza >= lunedi && scadenza <= domenica;
}

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// Rende un elemento modificabile sul posto, salvando su Firestore al blur
function abilitaModifica(el, coll, id, campo) {
  el.setAttribute('contenteditable', 'true');
  el.addEventListener('blur', async () => {
    const nuovo = el.textContent.trim();
    if (nuovo === '') { return; }
    try { await updateDoc(doc(db, coll, id), { [campo]: nuovo }); } catch (e) { console.error(e); }
  });
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); el.blur(); } });
}

window.filtraCategoria = function(cat, tipo) {
  if (tipo === 'scadenze') { filtroAttivoScadenze = cat; renderFiltriScadenze(ultimiDocsScadenze); applicaFiltroScadenze(); }

function applicaFiltroScadenze() {
  document.querySelectorAll('#scadenze-attive .scadenza').forEach(el => {
    const cat = el.getAttribute('data-categoria');

function applicaFiltroLink() {
  document.querySelectorAll('#link-lista .link-row').forEach(el => {
    const cat = el.getAttribute('data-categoria');
    el.style.display = (!filtroAttivoLink || cat === filtroAttivoLink) ? '' : 'none';
  });

function renderFiltriScadenze(docs) {
  const wrap = document.getElementById('filtri-scadenze');
  const categorieViste = new Set(CATEGORIE_DEFAULT_SCADENZE);
  docs.forEach(d => { if (d.categoria) categorieViste.add(d.categoria); });
  wrap.innerHTML = '';
  const tuttiBtn = document.createElement('button');
  tuttiBtn.className = 'filtro-chip' + (!filtroAttivoScadenze ? ' attivo' : '');
  tuttiBtn.textContent = 'Tutte';
  tuttiBtn.onclick = () => filtraCategoria(null, 'scadenze');
  wrap.appendChild(tuttiBtn);
  categorieViste.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'filtro-chip' + (filtroAttivoScadenze === cat ? ' attivo' : '');
    b.textContent = cat;
    b.onclick = () => filtraCategoria(cat, 'scadenze');
    wrap.appendChild(b);
  });
}
function renderFiltriLink(docs) {
  const wrap = document.getElementById('filtri-link');
  const categorieViste = new Set(CATEGORIE_DEFAULT_LINK);

  wrap.appendChild(tuttiBtn);
  categorieViste.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'filtro-chip' + (filtroAttivoLink === cat ? ' attivo' : '');
    b.textContent = cat;
    b.onclick = () => filtraCategoria(cat, 'link');
    wrap.appendChild(b);
  });
}

let ultimiDocsScadenze = [];
function renderScadenze(snap) {
  const attive = document.getElementById('scadenze-attive');
  const completate = document.getElementById('scadenze-completate');
  attive.innerHTML = ''; completate.innerHTML = '';

  const docs = [];
  snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
  docs.sort((a, b) => (a.data || '').localeCompare(b.data || ''));
  ultimiDocsScadenze = docs;
  renderFiltriScadenze(docs);

  docs.forEach(s => {
    const breve = formatDataBreve(s.data);
    const cr = contoAllaRovescia(s.data);
    const settCorr = inSettimanaCorrente(s.data);
    const el = document.createElement('div');
    let classi = 'scadenza';
    if (cr.urgente && !s.fatto) classi += ' urgente';
    if (settCorr && !s.fatto) classi += ' settimana-corrente';
    el.className = classi;
    el.setAttribute('data-search', s.testo.toLowerCase());
    el.setAttribute('data-categoria', s.categoria || 'Altro');
    el.innerHTML = `
      <div class="checkbox ${s.fatto ? 'checked' : ''}" onclick="toggleScadenza('${s.id}', ${s.fatto})">${s.fatto ? '✓' : ''}</div>
      <div class="data">${breve.giorno} ${breve.mese}<small>${breve.sett}</small></div>
      <div class="contenuto">
        <div class="titolo"><span class="titolo-testo">${escapeHtml(s.testo)}</span> <span class="badge-urgente">(${cr.testo})</span></div>
        ${s.allarme ? '<div class="meta">🔔 allarme attivo</div>' : ''}
      </div>
      <span class="badge-categoria">${escapeHtml(s.categoria || 'Altro')}</span>
    `;
    abilitaModifica(el.querySelector('.titolo-testo'), 'scadenze', s.id, 'testo');
    (s.fatto ? completate : attive).appendChild(el);
  });
  applicaFiltroScadenze();
}

window.stampaVista = function() { window.print(); };

window.scaricaVista = function() {
  const panelAttivo = document.querySelector('section.panel.active');
  const nomeTab = document.querySelector('nav.tabs button.active').textContent.trim();
  let testo = 'SCRIVANIA MIA — ' + nomeTab + '\n';
  testo += 'Esportato il ' + new Date().toLocaleDateString('it-IT') + '\n';
  testo += '='.repeat(40) + '\n\n';
  const elementi = panelAttivo.querySelectorAll('[data-search]');
  let trovati = false;
  elementi.forEach(el => {
    const visibile = el.offsetParent !== null && getComputedStyle(el).display !== 'none';
    if (visibile) { trovati = true; testo += '- ' + el.textContent.replace(/\s+/g, ' ').trim() + '\n'; }
  });
  if (!trovati) testo += '(nessun elemento visibile da esportare)\n';
  const blob = new Blob([testo], { type: 'text/plain;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'scrivania-mia-' + nomeTab.toLowerCase().replace(/\s+/g, '-') + '.txt';
  link.click();
  URL.revokeObjectURL(link.href);
};

let ascoltoAvviato = false;
function avviaAscoltoDati() {
  if (ascoltoAvviato) return;
  ascoltoAvviato = true;
  onSnapshot(collection(db, 'todos'), snap => { renderTodos(snap); aggiornaRicerca(); });
  onSnapshot(collection(db, 'scadenze'), snap => { renderScadenze(snap); aggiornaRicerca(); });
  onSnapshot(collection(db, 'diario'), snap => { renderDiario(snap); aggiornaRicerca(); });
  onSnapshot(collection(db, 'note'), snap => { renderNote(snap); aggiornaRicerca(); });
  onSnapshot(collection(db, 'appunti'), snap => { renderAppunti(snap); aggiornaRicerca(); });
  onSnapshot(collection(db, 'link'), snap => { renderLink(snap); aggiornaRicerca(); });
  document.getElementById('stato-connessione').textContent = 'Collegata a Firebase';
}
function aggiornaRicerca() {
  const val = document.getElementById('ricerca').value;
  if (val.trim() !== '') cerca(val);
}

// ============================================================
// NAVIGAZIONE TAB + RICERCA GLOBALE
// ============================================================
window.mostra = function(id, btn) {
  document.getElementById('ricerca').value = '';
  cerca('');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
};

window.pulisciRicerca = function() {
  const campo = document.getElementById('ricerca');
  campo.value = '';
  cerca('');
  campo.focus();
};

window.cerca = function(testo) {
  const q = testo.trim().toLowerCase();
  const hint = document.getElementById('search-hint');
  const panels = document.querySelectorAll('.panel');
  const tabs = document.querySelectorAll('nav.tabs button');

  if (q === '') {
    hint.style.display = 'none';
    document.querySelectorAll('[data-search]').forEach(el => el.style.display = '');
    tabs.forEach(t => t.disabled = false);
    panels.forEach(p => { p.classList.remove('active'); p.style.minHeight = ''; });
    const attivaPrima = document.querySelector('nav.tabs button.active') || document.querySelector('nav.tabs button');
    attivaPrima.click();
    applicaFiltroScadenze();
    applicaFiltroLink();
    return;
  }

  tabs.forEach(t => { t.classList.remove('active'); t.disabled = true; });

  let trovatiTotali = 0;
  panels.forEach(panel => {
    const items = panel.querySelectorAll('[data-search]');
    let trovatiInPanel = 0;
    items.forEach(el => {
      const match = (el.getAttribute('data-search') || '').includes(q);
      el.style.display = match ? '' : 'none';
      if (match) trovatiInPanel++;
    });
    trovatiTotali += trovatiInPanel;
    if (trovatiInPanel > 0) { panel.classList.add('active'); panel.style.minHeight = '0'; }
    else { panel.classList.remove('active'); panel.style.minHeight = ''; }
  });

  hint.style.display = 'block';
  hint.textContent = trovatiTotali === 0 ? `Nessun risultato per "${testo}"` : `${trovatiTotali} risultat${trovatiTotali === 1 ? 'o' : 'i'} per "${testo}" in tutte le sezioni`;
};
